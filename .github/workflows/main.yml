name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Enable the built-in Remote Desktop firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $chars = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]](33..47)
          }

          $passwordChars = @()
          $passwordChars += $chars.Upper | Get-Random -Count 4
          $passwordChars += $chars.Lower | Get-Random -Count 4
          $passwordChars += $chars.Number | Get-Random -Count 4
          $passwordChars += $chars.Special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "Skyro" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "Skyro"
          }

          New-LocalUser `
            -Name "Skyro" `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"

          "RDP_USERNAME=Skyro" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 10

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (-not $ip) {
            Write-Error "Tailscale IP tidak ditemukan."
            exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Port RDP 3389 tidak dapat diakses."
            exit 1
          }

          Write-Host "RDP berhasil diakses."

      - name: Install Roblox Studio
        shell: powershell
        timeout-minutes: 10
        run: |
          $url = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
          $installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Write-Host "Mengecek koneksi ke server Roblox..."
          try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -Method Head `
                -UseBasicParsing `
                -TimeoutSec 30

              Write-Host "Server Roblox dapat diakses."
              Write-Host "Status: $($response.StatusCode)"
          }
          catch {
              Write-Error "Tidak dapat mengakses server Roblox: $($_.Exception.Message)"
              exit 1
          }

          Write-Host "Mengunduh Roblox Studio..."

          try {
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing `
                -TimeoutSec 300
          }
          catch {
              Write-Error "Download Roblox Studio gagal: $($_.Exception.Message)"
              exit 1
          }

          if (-not (Test-Path $installer)) {
              Write-Error "File installer tidak ditemukan."
              exit 1
          }

          $size = (Get-Item $installer).Length
          Write-Host "Download selesai."
          Write-Host "Ukuran file: $([math]::Round($size / 1MB, 2)) MB"

          if ($size -lt 100KB) {
              Write-Error "File installer terlalu kecil atau kemungkinan bukan installer yang valid."
              exit 1
          }

          Write-Host "Menjalankan installer Roblox Studio..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "-install" `
            -PassThru

          Write-Host "Installer berjalan. PID: $($process.Id)"

          $process.WaitForExit()

          Write-Host "Installer selesai dengan exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Error "Installer Roblox Studio gagal."
              exit 1
          }

          Write-Host "Roblox Studio berhasil diinstall."

      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP READY"
          Write-Host "======================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] RDP masih aktif..."
            Start-Sleep -Seconds 300
          }
