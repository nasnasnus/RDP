name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Enable the built-in Remote Desktop firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "Skyro" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "Skyro"
          }

          New-LocalUser `
            -Name "Skyro" `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"

          "RDP_USERNAME=Skyro" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$env:RDP_PASSWORD" >> $env:GITHUB_ENV
          
      - name: Skip Microsoft Edge First Run
        shell: powershell
        run: |
          $edgePolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"

          if (-not (Test-Path $edgePolicy)) {
            New-Item -Path $edgePolicy -Force | Out-Null
          }

          New-ItemProperty `
            -Path $edgePolicy `
            -Name "HideFirstRunExperience" `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          New-ItemProperty `
            -Path $edgePolicy `
            -Name "BrowserSignin" `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          Write-Host "Microsoft Edge First Run berhasil dilewati."
          
      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Remove-Item $installer -Force

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          Start-Sleep -Seconds 10

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (-not $ip) {
            Write-Error "Tailscale IP tidak ditemukan."
            exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Port RDP 3389 tidak dapat diakses."
            exit 1
          }

          Write-Host "RDP berhasil diakses."

      - name: Install Roblox Studio
        shell: powershell
        run: |
          $url = "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
          $installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"

          Write-Host "Downloading Roblox Studio..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (-not (Test-Path $installer)) {
              Write-Error "Roblox Studio installer tidak berhasil diunduh."
              exit 1
          }

          $size = (Get-Item $installer).Length
          Write-Host "Download selesai: $([math]::Round($size / 1MB, 2)) MB"

          Write-Host "Starting Roblox Studio installer..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "-install"

          Write-Host "Installer sudah dijalankan."
          Write-Host "Workflow tetap berjalan."

      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP READY"
          Write-Host "======================================"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public class IdleTime {
              [StructLayout(LayoutKind.Sequential)]
              struct LASTINPUTINFO {
                  public uint cbSize;
                  public uint dwTime;
              }

              [DllImport("user32.dll")]
              static extern bool GetLastInputInfo(ref LASTINPUTINFO plii);

              public static uint GetIdleTime() {
                  LASTINPUTINFO lii = new LASTINPUTINFO();
                  lii.cbSize = (uint)Marshal.SizeOf(lii);

                  if (GetLastInputInfo(ref lii)) {
                      return ((uint)Environment.TickCount - lii.dwTime) / 1000;
                  }

                  return 0;
              }
          }
          "@

          $idleLimit = 600

          while ($true) {
              $idleSeconds = [IdleTime]::GetIdleTime()
              $idleMinutes = [math]::Round($idleSeconds / 60, 1)

              Write-Host "[$(Get-Date)] Idle: $idleMinutes menit"

              if ($idleSeconds -ge $idleLimit) {
                  Write-Host "Tidak ada aktivitas selama 10 menit."
                  Write-Host "Menghentikan workflow..."
                  exit 0
              }

              Start-Sleep -Seconds 30
          }
